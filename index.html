
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #080c29, #182c67, #44216d);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            overflow-x: hidden;
        }

        /* 3D Background */

        .scene {
            position: fixed;
            inset: 0;
            perspective: 900px;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .cube {
            position: absolute;
            width: 80px;
            height: 80px;
            transform-style: preserve-3d;
            animation: rotateCube 12s infinite linear;
        }

        .cube span {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(120, 190, 255, 0.7);
            background: rgba(100, 150, 255, 0.08);
            box-shadow: 0 0 20px rgba(100, 180, 255, 0.3);
        }

        .cube span:nth-child(1) {
            transform: translateZ(40px);
        }

        .cube span:nth-child(2) {
            transform: rotateY(90deg) translateZ(40px);
        }

        .cube span:nth-child(3) {
            transform: rotateY(180deg) translateZ(40px);
        }

        .cube span:nth-child(4) {
            transform: rotateY(-90deg) translateZ(40px);
        }

        .cube span:nth-child(5) {
            transform: rotateX(90deg) translateZ(40px);
        }

        .cube span:nth-child(6) {
            transform: rotateX(-90deg) translateZ(40px);
        }

        .cube1 {
            top: 15%;
            left: 10%;
        }

        .cube2 {
            bottom: 15%;
            right: 10%;
            animation-duration: 18s;
        }

        .cube3 {
            top: 60%;
            left: 75%;
            animation-duration: 15s;
        }

        @keyframes rotateCube {
            from {
                transform: rotateX(0deg) rotateY(0deg);
            }

            to {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        /* Floating Orbs */

        .orb {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                white, #6d8cff, #4934a9);
            box-shadow: 0 0 50px rgba(100, 120, 255, 0.6);
            opacity: 0.65;
            animation: floatOrb 7s ease-in-out infinite;
        }

        .orb1 {
            top: 12%;
            right: 15%;
        }

        .orb2 {
            bottom: 10%;
            left: 12%;
            width: 75px;
            height: 75px;
            animation-delay: 2s;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-45px);
            }
        }

        /* Particles */

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #a9d9ff;
            box-shadow: 0 0 15px #75baff;
            animation: moveParticle 8s infinite ease-in-out;
        }

        .p1 { top: 20%; left: 40%; }
        .p2 { top: 70%; left: 30%; animation-delay: 2s; }
        .p3 { top: 40%; right: 15%; animation-delay: 3s; }
        .p4 { bottom: 15%; right: 40%; animation-delay: 1s; }
        .p5 { top: 10%; left: 70%; animation-delay: 4s; }

        @keyframes moveParticle {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-60px);
                opacity: 1;
            }
        }

        /* Main Form */

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(15px);
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #27346b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background: #eef2ff;
            color: #27346b;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <!-- Animated Background -->

    <div class="scene">

        <div class="cube cube1">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>

        <div class="cube cube2">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>

        <div class="cube cube3">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>

        <div class="orb orb1"></div>
        <div class="orb orb2"></div>

        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>

    </div>

    <!-- Prediction Form -->

    <div class="container">

        <h1>Student Marks Prediction</h1>

        <p class="subtitle">
            Predict Student Marks Using Machine Learning
        </p>

        <label>Hours Studied</label>
        <input type="number" id="hours"
               placeholder="Enter study hours"
               min="0" max="24" step="0.1">

        <label>Previous Marks</label>
        <input type="number" id="previous"
               placeholder="Enter previous marks"
               min="0" max="100" step="0.1">

        <label>Sleep Hours</label>
        <input type="number" id="sleep"
               placeholder="Enter sleep hours"
               min="0" max="24" step="0.1">

        <button onclick="predictMarks()">
            Predict Marks
        </button>

        <div id="result"></div>

        <p class="footer">
            Student Marks Prediction Project
        </p>

    </div>

    <!-- JavaScript -->

    <script>

        async function predictMarks() {

            const hoursInput = document.getElementById("hours");
            const previousInput = document.getElementById("previous");
            const sleepInput = document.getElementById("sleep");

            const result = document.getElementById("result");

            if (
                hoursInput.value === "" ||
                previousInput.value === "" ||
                sleepInput.value === ""
            ) {
                alert("Please enter all values!");
                return;
            }

            const hours = Number(hoursInput.value);
            const previous = Number(previousInput.value);
            const sleep = Number(sleepInput.value);

            if (
                hours < 0 || hours > 24 ||
                previous < 0 || previous > 100 ||
                sleep < 0 || sleep > 24
            ) {
                alert("Please enter valid values!");
                return;
            }

            result.style.display = "block";
            result.innerHTML = "Predicting...";

            try {

                const response = await fetch("/predict", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        hours: hours,
                        previous: previous,
                        sleep: sleep
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Prediction failed");
                }

                result.innerHTML =
                    "Predicted Marks: " + data.prediction;

            } catch (error) {

                result.innerHTML =
                    "Error: " + error.message;

            }
        }

    </script>

</body>
</html>
